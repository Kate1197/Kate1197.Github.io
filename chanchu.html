<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9172CC">
<title>产出汇总 · 艾米动态监控</title>
<style>
  :root{
    /* Material 3 配色 - #9172CC 为核心 */
    --md-primary: #9172CC;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #E9DDFF;
    --md-on-primary-container: #250460;
    --md-secondary: #5E5C71;
    --md-secondary-container: #E4E0F4;
    --md-on-secondary-container: #1B0A2E;
    --md-tertiary: #7B5260;
    --md-surface: #FEF7FF;
    --md-surface-dim: #DED7E0;
    --md-surface-bright: #FEF7FF;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #F7F0FA;
    --md-surface-container: #F2EBF5;
    --md-surface-container-high: #ECE5EF;
    --md-surface-container-highest: #E6E0E9;
    --md-on-surface: #1D1B20;
    --md-on-surface-variant: #49454F;
    --md-outline: #79747E;
    --md-outline-variant: #CAC4D0;
    --md-success: #2E7D32;
    --md-success-container: #C8E6C9;
    --md-warning: #ED6C02;
    --md-warning-container: #FFE0B2;
    --md-error: #B3261E;
    --md-error-container: #F9DEDC;
    --md-elev-1: 0 1px 2px 0 rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.08);
    --md-elev-2: 0 1px 2px 0 rgba(0,0,0,0.16), 0 2px 6px 2px rgba(0,0,0,0.10);
    --md-elev-3: 0 4px 8px 3px rgba(0,0,0,0.10), 0 1px 3px 0 rgba(0,0,0,0.14);
    --md-radius-sm: 8px;
    --md-radius-md: 12px;
    --md-radius-lg: 16px;
  }
  [data-theme="dark"]{
    --md-surface: #141218;
    --md-surface-dim: #141218;
    --md-surface-bright: #141218;
    --md-surface-container-lowest: #0F0D13;
    --md-surface-container-low: #1D1B20;
    --md-surface-container: #211F26;
    --md-surface-container-high: #2B2930;
    --md-surface-container-highest: #36343B;
    --md-on-surface: #E6E0E9;
    --md-on-surface-variant: #CAC4D0;
    --md-outline: #938F99;
    --md-outline-variant: #49454F;
    --md-primary-container: #4A3A6B;
    --md-on-primary-container: #E9DDFF;
    --md-secondary-container: #4A4759;
    --md-on-secondary-container: #E4E0F4;
    --md-elev-1: 0 1px 2px 0 rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.20);
    --md-elev-2: 0 1px 2px 0 rgba(0,0,0,0.40), 0 2px 6px 2px rgba(0,0,0,0.25);
    --md-elev-3: 0 4px 8px 3px rgba(0,0,0,0.35), 0 1px 3px 0 rgba(0,0,0,0.30);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family: Roboto, "Roboto Flex", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--md-surface);
    color: var(--md-on-surface);
    min-height: 100vh;
    line-height: 1.5;
    font-size: 14px;
    letter-spacing: 0.1px;
  }
  .wrap{max-width: 720px; margin: 0 auto; padding: 0 0 60px;}

  /* 顶部导航条：返回 + 标题 + 主题切换 */
  .cc-topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--md-outline-variant);
  }
  [data-theme="dark"] .cc-topbar{
    background: rgba(20,18,24,0.82);
  }
  .cc-back{
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    text-decoration: none; border: none; cursor: pointer;
  }
  .cc-back svg{ width: 20px; height: 20px; stroke: currentColor; }
  .cc-topbar-title{
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 700; color: var(--md-on-surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-theme{
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: none; cursor: pointer; font-size: 16px;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    display: flex; align-items: center; justify-content: center;
  }

  /* ========== 产出汇总 ========== */
  .cc-hero{
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
    padding: 22px 16px 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--md-outline-variant);
  }
  .cc-hero-left{ min-width:0; }
  .cc-hero-title{ font-size:22px; font-weight:800; color:var(--md-on-surface); letter-spacing:.5px; }
  .cc-hero-sub{ font-size:12px; color:var(--md-on-surface-variant); margin-top:5px; }
  .cc-hero-time{
    font-size:12px; font-weight:600; color:var(--md-primary);
    background: var(--md-primary-container); padding:6px 12px; border-radius:999px;
    white-space:nowrap;
  }
  .cc-tip{
    margin: 12px 16px 4px; font-size:12px; color:var(--md-on-surface-variant); line-height:1.6;
  }
  .cc-list{ padding: 12px 16px 120px; display:flex; flex-direction:column; gap:18px; }
  .cc-item{
    background: var(--md-surface-container, #fff);
    border:1px solid var(--md-outline-variant);
    border-radius: var(--md-radius-sm);
    padding: 14px 16px; cursor:pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  [data-theme="dark"] .cc-item{ background: var(--md-surface-container); }
  .cc-item:hover{ transform: translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); border-color: var(--md-primary); }
  .cc-item-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .cc-item-date{
    font-size:12px; font-weight:700; color:var(--md-primary);
    background: var(--md-primary-container); padding:3px 10px; border-radius:999px;
  }
  .cc-item-count{
    font-size:11px; color:var(--md-on-surface-variant);
    border:1px solid var(--md-outline-variant); border-radius:999px; padding:2px 9px;
  }
  /* 日期分组：同日多份汇总并排展示 */
  .cc-group{ display:flex; flex-direction:column; gap:8px; }
  .cc-group-head{ display:flex; align-items:center; gap:8px; padding:0 2px; }
  .cc-group-date{ font-size:13px; font-weight:800; color:var(--md-on-surface); letter-spacing:.3px; }
  .cc-group-wd{ font-size:11px; color:var(--md-on-surface-variant); }
  .cc-group-badge{
    margin-left:auto; font-size:11px; font-weight:700;
    color:var(--md-primary); background:var(--md-primary-container);
    padding:2px 10px; border-radius:999px;
  }
  .cc-group-body{ display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width: 760px){ .cc-group-body.multi{ grid-template-columns:1fr 1fr; } }
  .cc-item-title{ font-size:15px; font-weight:700; color:var(--md-on-surface); margin-bottom:6px; }
  .cc-item-desc{
    font-size:13px; color:var(--md-on-surface-variant); line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .cc-empty{
    margin: 28px 16px; padding: 34px 20px; text-align:center;
    border:1px dashed var(--md-outline-variant); border-radius: var(--md-radius-sm);
    color: var(--md-on-surface-variant); font-size:14px; line-height:1.7;
  }
  .cc-empty .big{ font-size:32px; display:block; margin-bottom:10px; }

  /* 产出汇总 弹窗 */
  .cc-modal{ display:none; position:fixed; inset:0; z-index:9999; }
  .cc-modal.open{ display:flex; align-items:center; justify-content:center; animation:fadeIn .2s; }
  .cc-modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
  .cc-modal-content{
    position:relative; z-index:1; background:var(--md-surface);
    border-radius:20px; max-width:540px; width:92%; max-height:82vh;
    display:flex; flex-direction:column; overflow:hidden;
    animation:slideUp .25s;
  }
  .cc-modal-close{
    position:absolute; top:12px; right:12px; z-index:10;
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:var(--md-surface-container-high); color:var(--md-on-surface);
    display:flex; align-items:center; justify-content:center;
  }
  .cc-modal-close:hover{ background:var(--md-outline-variant); }
  .cc-modal-close svg{ width:18px; height:18px; stroke:currentColor; }
  .cc-modal-body{ padding:26px 22px 18px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .cc-modal-date{ font-size:13px; font-weight:700; color:var(--md-primary); letter-spacing:.5px; }
  .cc-modal-title{ font-size:19px; font-weight:700; color:var(--md-on-surface); line-height:1.45; }
  .cc-modal-text{ font-size:14px; line-height:1.85; color:var(--md-on-surface); white-space:pre-wrap; }
  .cc-modal-footer{ padding:12px 22px 22px; border-top:1px solid var(--md-outline-variant); }
  .cc-modal-link{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 18px; border-radius:20px; background:#E6162D; color:#fff;
    font-size:13px; font-weight:600; text-decoration:none; transition:opacity .2s;
  }
  .cc-modal-link:hover{ opacity:.85; }
  .cc-modal-link svg{ width:16px; height:16px; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @keyframes slideUp{from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);}}

  /* 筛选：入口按钮（位于「更新至」左侧） */
  .cc-hero-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cc-filter-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; font-family:inherit; cursor:pointer;
    color: var(--md-on-surface-variant);
    background: var(--md-surface-container-high);
    border:1px solid var(--md-outline-variant);
    padding:6px 12px; border-radius:999px; white-space:nowrap;
    transition: color .2s, border-color .2s, background .2s;
  }
  .cc-filter-btn svg{ width:14px; height:14px; stroke:currentColor; }
  .cc-filter-btn:hover{ border-color:var(--md-primary); color:var(--md-primary); }
  .cc-filter-btn.active{ background:var(--md-primary); color:var(--md-on-primary); border-color:var(--md-primary); }

  /* 筛选结果摘要条 */
  .cc-filter-summary{
    margin: 10px 16px 0; padding: 10px 14px;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    border-radius: var(--md-radius-sm); font-size:12px; line-height:1.6;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .cc-filter-summary[hidden]{ display:none; }
  .cc-filter-summary .clear{
    margin-left:auto; color:var(--md-primary); font-weight:700;
    cursor:pointer; text-decoration:underline; white-space:nowrap;
  }

  /* 筛选弹窗 */
  .cc-filter-modal{ display:none; position:fixed; inset:0; z-index:10000; }
  .cc-filter-modal.open{ display:flex; align-items:center; justify-content:center; animation:fadeIn .2s; }
  .cc-filter-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
  .cc-filter-content{
    position:relative; z-index:1; background:var(--md-surface);
    border-radius:20px; max-width:460px; width:92%; max-height:86vh;
    display:flex; flex-direction:column; overflow:hidden; animation:slideUp .25s;
  }
  .cc-filter-head{
    padding:18px 20px 12px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--md-outline-variant);
  }
  .cc-filter-head-title{ font-size:17px; font-weight:700; color:var(--md-on-surface); }
  .cc-filter-close{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:var(--md-surface-container-high); color:var(--md-on-surface);
    display:flex; align-items:center; justify-content:center;
  }
  .cc-filter-close svg{ width:18px; height:18px; stroke:currentColor; }
  .cc-filter-body{ padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
  .cc-field{ display:flex; flex-direction:column; gap:7px; }
  .cc-field-label{ font-size:12px; font-weight:700; color:var(--md-on-surface-variant); letter-spacing:.3px; }
  .cc-input{
    width:100%; box-sizing:border-box;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--md-outline-variant);
    background:var(--md-surface-container-low); color:var(--md-on-surface);
    font-size:14px; font-family:inherit;
  }
  .cc-input:focus{ outline:none; border-color:var(--md-primary); }
  .cc-range-row{ display:flex; align-items:center; gap:8px; }
  .cc-range-row .cc-input{ flex:1; min-width:0; }
  .cc-range-row .sep{ color:var(--md-on-surface-variant); font-size:13px; }
  .cc-quick{ display:flex; gap:6px; flex-wrap:wrap; }
  .cc-quick button{
    padding:6px 12px; border-radius:999px; cursor:pointer; font-size:12px; font-family:inherit;
    border:1px solid var(--md-outline-variant); background:transparent; color:var(--md-on-surface-variant);
  }
  .cc-quick button:hover{ border-color:var(--md-primary); color:var(--md-primary); }
  .cc-filter-count{ font-size:13px; color:var(--md-on-surface-variant); text-align:center; padding:2px 0; }
  .cc-filter-count strong{ color:var(--md-primary); font-weight:800; }
  .cc-filter-foot{ padding:12px 20px 20px; display:flex; gap:10px; border-top:1px solid var(--md-outline-variant); }
  .cc-btn{ flex:1; padding:12px; border-radius:12px; border:none; cursor:pointer; font-size:14px; font-weight:700; font-family:inherit; }
  .cc-btn.ghost{ background:var(--md-surface-container-high); color:var(--md-on-surface); }
  .cc-btn.primary{ background:var(--md-primary); color:var(--md-on-primary); }
  .cc-btn.primary:hover{ opacity:.9; }

  footer{
    text-align:center; color: var(--md-on-surface-variant); font-size:12px;
    padding: 24px 16px 16px; line-height:1.6;
    border-top: 1px solid var(--md-outline-variant);
    margin-top: 16px;
  }
  .footer-links{
    display:flex; justify-content:center; gap:16px; margin:12px 0 8px; flex-wrap:wrap;
  }
  .footer-links a{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:999px;
    background: var(--md-surface-container-high);
    color: var(--md-primary); text-decoration:none;
    font-size:12px; transition: all 0.2s;
  }
  .footer-links a:hover{ background: var(--md-primary); color:#fff; transform: translateY(-2px); }
  .footer-links svg{ width:14px; height:14px; }

  @media (max-width:640px){
    .cc-modal-content{ max-width:95%; }
    .cc-modal-body{ padding:24px 18px 16px; }
    .cc-modal-footer{ padding:12px 18px 20px; }
  }
</style>
</head>
<body>

<div class="cc-topbar">
  <button class="cc-back" id="ccBack" title="返回" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <div class="cc-topbar-title">产出汇总</div>
  <button class="cc-theme" id="ccTheme" title="切换深色/浅色">🌙</button>
</div>

<div class="wrap">

  <div class="cc-hero">
    <div class="cc-hero-left">
      <div class="cc-hero-title">产出汇总</div>
      <div class="cc-hero-sub">由 @艾产速览 整理汇总</div>
    </div>
    <div class="cc-hero-right">
      <button class="cc-filter-btn" id="ccFilterBtn" title="筛选产出汇总" aria-label="筛选产出汇总">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span>筛选</span>
      </button>
      <div class="cc-hero-time" id="ccUpdated">更新至 —</div>
    </div>
  </div>

  <div class="cc-tip">收录本月 1 日至昨日的超话产出汇总，最多 31 天 · 每月最后一天 23:00 归档清空，次月重新收集</div>

  <div class="cc-filter-summary" id="ccFilterSummary" hidden></div>

  <div class="cc-list" id="ccList"></div>

  <footer>
    艾米动态监控 · 产出汇总（@艾产速览）<br>
    数据人工录入 · 仅供粉丝向参考
    <div class="footer-links">
      <a href="https://weibo.com/7975536178" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.098 20.323c-3.977.391-7.414-1.406-7.672-4.02-.259-2.609 2.759-5.047 6.74-5.441 3.979-.394 7.413 1.404 7.671 4.018.259 2.6-2.759 5.049-6.737 5.443zm-1.473-1.981c-2.417.228-4.444-.781-4.58-2.235-.139-1.455 1.708-2.863 4.126-3.091 2.417-.229 4.445.781 4.581 2.234.138 1.455-1.708 2.864-4.126 3.092z"/></svg>
        @艾产速览
      </a>
    </div>
  </footer>

</div>

<!-- 产出汇总弹窗 -->
<div class="cc-modal" id="ccModal" aria-hidden="true">
  <div class="cc-modal-backdrop"></div>
  <div class="cc-modal-content">
    <button class="cc-modal-close" id="ccModalClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="cc-modal-body">
      <div class="cc-modal-date" id="ccModalDate"></div>
      <div class="cc-modal-title" id="ccModalTitle"></div>
      <div class="cc-modal-text" id="ccModalText"></div>
    </div>
    <div class="cc-modal-footer">
      <a id="ccModalLink" href="#" target="_blank" rel="noopener" class="cc-modal-link">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.098 20.323c-3.977.391-7.414-1.406-7.672-4.02-.259-2.609 2.759-5.047 6.74-5.441 3.979-.394 7.413 1.404 7.671 4.018.259 2.6-2.759 5.049-6.737 5.443zm-1.473-1.981c-2.417.228-4.444-.781-4.58-2.235-.139-1.455 1.708-2.863 4.126-3.091 2.417-.229 4.445.781 4.581 2.234.138 1.455-1.708 2.864-4.126 3.092z"/></svg>
        查看原贴
      </a>
    </div>
  </div>
</div>

<!-- 产出汇总筛选弹窗 -->
<div class="cc-filter-modal" id="ccFilterModal" aria-hidden="true">
  <div class="cc-filter-backdrop"></div>
  <div class="cc-filter-content">
    <div class="cc-filter-head">
      <div class="cc-filter-head-title">筛选产出汇总</div>
      <button class="cc-filter-close" id="ccFilterClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cc-filter-body">
      <div class="cc-field">
        <div class="cc-field-label">关键词</div>
        <input class="cc-input" id="ccKw" type="search" placeholder="搜索标题或正文关键词，如：饭修、饭拍、老师名…">
      </div>
      <div class="cc-field">
        <div class="cc-field-label">日期（定位某一天只填一个；看“几号到几号”把起止都填上）</div>
        <div class="cc-range-row">
          <input class="cc-input" id="ccFrom" type="date">
          <span class="sep">~</span>
          <input class="cc-input" id="ccTo" type="date">
        </div>
      </div>
      <div class="cc-quick">
        <button type="button" data-range="all">全部时间</button>
        <button type="button" data-range="month">本月</button>
        <button type="button" data-range="7">近7天</button>
        <button type="button" data-range="3">近3天</button>
      </div>
      <div class="cc-filter-count" id="ccFilterCount">共 <strong>0</strong> 份汇总</div>
    </div>
    <div class="cc-filter-foot">
      <button class="cc-btn ghost" id="ccFilterReset">重置</button>
      <button class="cc-btn primary" id="ccFilterApply">应用筛选</button>
    </div>
  </div>

  function ccPad(n){ return String(n).padStart(2, '0'); }
  function ccYmd(d){ return d.getFullYear() + '-' + ccPad(d.getMonth()+1) + '-' + ccPad(d.getDate()); }

  // 可见条目：本月 1 日 ~ 昨天，最多 31 条；每月最后一天 23:00 起清空（次月重新收集）
  function ccVisibleEntries(){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const firstYmd = y + '-' + ccPad(m+1) + '-01';
    const lastDay = new Date(y, m+1, 0).getDate();
    if (now.getDate() === lastDay && now.getHours() >= 23) return [];   // 月末 23:00 归档清空
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const yestYmd = ccYmd(yest);
    return (chanchuData.entries || [])
      .filter(e => e && e.date && e.date >= firstYmd && e.date <= yestYmd)
      .sort((a, b) => (a.date < b.date ? 1 : -1))
      .slice(0, 31);
  }

  function ccPartNo(it){
    const m = /[（(]\s*(\d+)\s*\/\s*(\d+)\s*[）)]/.exec(it.title || '');
    return m ? parseInt(m[1], 10) : 1;
  }
  function ccWeekday(ymd){
    const d = new Date(ymd + 'T00:00:00');
    return isNaN(d.getTime()) ? '' : '周' + '日一二三四五六'[d.getDay()];
  }

  // ========== 筛选（关键词 / 日期区间） ==========
  const ccFilter = { keyword: '', from: '', to: '' };
  function ccIsFilterActive(){ return !!(ccFilter.keyword || ccFilter.from || ccFilter.to); }
  function ccApplyFilter(items){
    let out = items;
    const kw = (ccFilter.keyword || '').trim().toLowerCase();
    if (kw){
      out = out.filter(e =>
        (e.title || '').toLowerCase().includes(kw) ||
        (e.text || '').toLowerCase().includes(kw));
    }
    // 日期：只填一个 → 精确定位到该日；起止都填 → 该区间
    if (ccFilter.from && ccFilter.to){
      out = (ccFilter.from === ccFilter.to)
        ? out.filter(e => e.date === ccFilter.from)
        : out.filter(e => (e.date || '') >= ccFilter.from && (e.date || '') <= ccFilter.to);
    } else if (ccFilter.from){
      out = out.filter(e => e.date === ccFilter.from);
    } else if (ccFilter.to){
      out = out.filter(e => e.date === ccFilter.to);
    }
    return out;
  }
  function ccFilteredItems(){ return ccApplyFilter(ccVisibleEntries()); }

  // 摘要文案：关键词「XX」 · 2026-10-01 ~ 2026-10-13 · 共 N 份汇总
  function ccFilterSummaryText(count){
    const parts = [];
    if (ccFilter.keyword) parts.push('关键词「' + ccFilter.keyword + '」');
    const f = ccFilter.from, t = ccFilter.to;
    if (f && t) parts.push(f === t ? f : (f + ' ~ ' + t));
    else if (f) parts.push(f);
    else if (t) parts.push(t);
    parts.push('共 ' + count + ' 份汇总');
    return parts.join(' · ');
  }
  function ccUpdateFilterUI(count){
    const active = ccIsFilterActive();
    const btn = document.getElementById('ccFilterBtn');
    if (btn) btn.classList.toggle('active', active);
    const bar = document.getElementById('ccFilterSummary');
    if (!bar) return;
    if (active){
      bar.hidden = false;
      bar.innerHTML = '<span>' + ccFilterSummaryText(count) + '</span>' +
        '<span class="clear" id="ccFilterClear">清除筛选</span>';
      document.getElementById('ccFilterClear').addEventListener('click', ccResetFilterState);
    } else {
      bar.hidden = true;
      bar.innerHTML = '';
    }
  }
  function ccResetFilterState(){
    ccFilter.keyword = ''; ccFilter.from = ''; ccFilter.to = '';
    ccRender();
  }

  function ccRender(){
    const listEl = document.getElementById('ccList');
    if (!listEl) return;
    const updEl = document.getElementById('ccUpdated');
    if (updEl) updEl.textContent = '更新至 ' + (chanchuData.updatedAt || '—');

    const items = ccFilteredItems();
    ccUpdateFilterUI(items.length);

    if (!items.length){
      const inner = ccIsFilterActive()
        ? '<span class="big">🔍</span>没有符合条件的产出汇总<br><span style="font-size:12px;">试试更换关键词，或调整日期范围后重试</span>'
        : '<span class="big">📭</span>暂无本月产出汇总<br><span style="font-size:12px;">数据人工录入，等待 @艾产速览 更新 · 每月最后一天 23:00 归档清空，次月重新收集</span>';
      listEl.innerHTML = '<div class="cc-empty">' + inner + '</div>';
      return;
    }
    // 按日期分组（新的在上）；同一天拆分成多份汇总的，并排展示
    const groups = [], gmap = {};
    items.forEach(it => {
      if (!gmap[it.date]) { gmap[it.date] = { date: it.date, items: [] }; groups.push(gmap[it.date]); }
      gmap[it.date].items.push(it);
    });
    listEl.innerHTML = groups.map(g => {
      g.items.sort((a, b) => ccPartNo(a) - ccPartNo(b));   // (1/2) 在前
      const cards = g.items.map(it => `
        <div class="cc-item" data-i="${items.indexOf(it)}">
          ${it.count ? '<div class="cc-item-top"><span class="cc-item-count">' + it.count + '</span></div>' : ''}
          <div class="cc-item-title">${it.title || ''}</div>
          <div class="cc-item-desc">${(it.text || '').replace(/</g, '&lt;')}</div>
        </div>`).join('');
      return `
        <div class="cc-group">
          <div class="cc-group-head">
            <span class="cc-group-date">${g.date}</span>
            <span class="cc-group-wd">${ccWeekday(g.date)}</span>
            <span class="cc-group-badge">${g.items.length} 份汇总</span>
          </div>
          <div class="cc-group-body${g.items.length > 1 ? ' multi' : ''}">${cards}</div>
        </div>`;
    }).join('');
    listEl.querySelectorAll('.cc-item').forEach(el => {
      el.addEventListener('click', () => ccOpenModal(items[+el.dataset.i]));
    });
  }

  const ccModalEl = document.getElementById('ccModal');
  function ccOpenModal(it){
    if (!ccModalEl || !it) return;
    document.getElementById('ccModalDate').textContent = it.date || '';
    document.getElementById('ccModalTitle').textContent = it.title || '';
    document.getElementById('ccModalText').textContent = it.text || '';
    document.getElementById('ccModalLink').href = it.link || 'https://weibo.com/';
    ccModalEl.classList.add('open');
    ccModalEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function ccCloseModal(){
    if (!ccModalEl) return;
    ccModalEl.classList.remove('open');
    ccModalEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  if (ccModalEl){
    ccModalEl.querySelector('.cc-modal-backdrop').addEventListener('click', ccCloseModal);
    document.getElementById('ccModalClose').addEventListener('click', ccCloseModal);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && ccModalEl.classList.contains('open')) ccCloseModal(); });
  }

  // ========== 筛选弹窗交互 ==========
  const ccFilterModalEl = document.getElementById('ccFilterModal');
  const ccKwEl = document.getElementById('ccKw');
  const ccFromEl = document.getElementById('ccFrom');
  const ccToEl = document.getElementById('ccTo');
  const ccFilterCountEl = document.getElementById('ccFilterCount');

  // 实时估算匹配数量（不改变已生效的筛选，仅预览）
  function ccPreviewCount(){
    const prev = { keyword: ccFilter.keyword, from: ccFilter.from, to: ccFilter.to };
    ccFilter.keyword = ccKwEl.value.trim();
    ccFilter.from = ccFromEl.value;
    ccFilter.to = ccToEl.value;
    let ran = false;
    try { const n = ccFilteredItems().length; ran = true; ccFilterCountEl.innerHTML = '共 <strong>' + n + '</strong> 份汇总'; }
    finally { ccFilter.keyword = prev.keyword; ccFilter.from = prev.from; ccFilter.to = prev.to; }
    void ran;
  }
  function ccOpenFilter(){
    ccKwEl.value = ccFilter.keyword;
    ccFromEl.value = ccFilter.from;
    ccToEl.value = ccFilter.to;
    ccPreviewCount();
    ccFilterModalEl.classList.add('open');
    ccFilterModalEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function ccCloseFilter(){
    ccFilterModalEl.classList.remove('open');
    ccFilterModalEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  function ccApplyFromModal(){
    ccFilter.keyword = ccKwEl.value.trim();
    ccFilter.from = ccFromEl.value;
    ccFilter.to = ccToEl.value;
    ccCloseFilter();
    ccRender();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  function ccSetQuickRange(kind){
    const now = new Date();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (kind === 'all'){
      ccFromEl.value = ''; ccToEl.value = '';
    } else if (kind === 'month'){
      ccFromEl.value = now.getFullYear() + '-' + ccPad(now.getMonth() + 1) + '-01';
      ccToEl.value = ccYmd(yest);
    } else {
      const n = parseInt(kind, 10);
      const s = new Date(now); s.setDate(now.getDate() - n);
      ccFromEl.value = ccYmd(s); ccToEl.value = ccYmd(yest);
    }
    ccPreviewCount();
  }

  if (ccFilterModalEl){
    document.getElementById('ccFilterBtn').addEventListener('click', ccOpenFilter);
    document.getElementById('ccFilterClose').addEventListener('click', ccCloseFilter);
    ccFilterModalEl.querySelector('.cc-filter-backdrop').addEventListener('click', ccCloseFilter);
    document.getElementById('ccFilterApply').addEventListener('click', ccApplyFromModal);
    document.getElementById('ccFilterReset').addEventListener('click', function(){
      ccKwEl.value = ''; ccFromEl.value = ''; ccToEl.value = '';
      ccPreviewCount();
    });
    [ccKwEl, ccFromEl, ccToEl].forEach(el => el.addEventListener('input', ccPreviewCount));
    document.querySelectorAll('.cc-quick button').forEach(b =>
      b.addEventListener('click', () => ccSetQuickRange(b.dataset.range)));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && ccFilterModalEl.classList.contains('open')) ccCloseFilter();
    });
  }

  ccRender();
</script>
