locale: zh_Hans

backend:
  name: turbo-github
  turbo_site_id: aace51e4-0706-42d3-95cd-98127232387d
  branch: main

site_url: https://kate1197.github.io
display_url: https://kate1197.github.io
logo_url: /logo_aimi_daily_white.png

media_folder: uploads
public_folder: /uploads

collections:
  - name: home
    label: 首页内容
    files:
      - name: banner
        label: Banner
        file: data/banner.json
        fields:
          - { name: enabled, label: 显示 Banner, widget: boolean, default: true }
          - { name: image, label: Banner 图片, widget: image, allow_multiple: false, required: false }
          - { name: title, label: 主标题, widget: string, hint: "可用 **文字** 加粗" }
          - name: chips
            label: 标签
            widget: list
            field: { name: chip, label: 标签, widget: string }
          - name: ad
            label: 广告位
            widget: object
            fields:
              - { name: enabled, label: 显示广告, widget: boolean, default: true }
              - { name: image, label: 广告图片, widget: image, allow_multiple: false }
              - { name: title, label: 广告标题, widget: string }
              - { name: subtitle, label: 广告副标题, widget: string }
              - { name: buttonText, label: 按钮文字, widget: string }
              - { name: buttonUrl, label: 按钮链接, widget: string }
          - name: extraBanners
            label: 自定义 Banner（最多 10 个）
            widget: list
            required: false
            hint: "用于活动/推广，样式与广告位一致，排在广告位之后，最多显示 10 个"
            summary: "{{fields.title}}"
            fields:
              - { name: enabled, label: 显示该 Banner, widget: boolean, default: true }
              - { name: image, label: 背景图, widget: image, allow_multiple: false }
              - { name: title, label: 标题, widget: string }
              - { name: subtitle, label: 副标题, widget: string, required: false }
              - { name: buttonText, label: 按钮文字, widget: string, required: false }
              - { name: buttonUrl, label: 按钮链接, widget: string, required: false }

      - name: notice
        label: 通知条
        file: data/notice.json
        fields:
          - { name: enabled, label: 显示通知条, widget: boolean, default: true }
          - { name: icon, label: 图标, widget: string, default: "ℹ" }
          - { name: content, label: 通知内容, widget: markdown, hint: "可用 **文字** 加粗" }

      - name: messages
        label: 消息盒子
        file: data/messages.json
        fields:
          - { name: date, label: 消息日期, widget: date, format: "YYYY-MM-DD" }
          - name: msgs
            label: 消息列表
            widget: list
            fields:
              - { name: id, label: 消息 ID, widget: string, hint: "建议格式：年月日-简短标识，例如 20261026-hengdian" }
              - { name: type, label: 类型, widget: select, options: [{ label: "更新", value: "update" }, { label: "粉丝", value: "fans" }, { label: "转发", value: "repost" }, { label: "商务", value: "business" }, { label: "自定义", value: "custom" }] }
              - { name: title, label: 标题, widget: string }
              - { name: body, label: 正文, widget: text }
              - { name: time, label: 显示时间, widget: string, hint: "例如：2026年10月26日 09:30" }

      - name: xingcheng
        label: 行程活动
        file: data/xingcheng.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS，例如 2026-10-27 13:20:00" }
          - { name: intro, label: 副标题, widget: string, hint: "显示在页面标题下方的一句话" }
          - name: types
            label: 活动类型标签
            widget: list
            hint: "这里维护所有活动类型，前端的筛选按钮会自动按此列表生成；新增后即可在下方「活动类型」中选用"
            field: { name: type, label: 标签名称, widget: string }
          - name: events
            label: 行程活动列表
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            hint: "按时间先后填写即可，前端会自动按「即将开始 / 已结束」排序分组"
            fields:
              - { name: title, label: 活动名称, widget: string }
              - { name: type, label: 活动类型, widget: string, hint: "填写上方「活动类型标签」中的某一项，例如：红毯" }
              - { name: date, label: 活动日期, widget: string, hint: "手动填写，格式 YYYY-MM-DD，例如 2026-10-27（也兼容 2026/10/27、2026.10.27 等写法）。保存后卡片状态会自动重算：今天 / 即将开始 / 已结束" }
              - { name: time, label: 活动时间, widget: string, required: false, hint: "例如：15:00；全天活动可留空" }
              - { name: location, label: 地点, widget: string, required: false, hint: "例如：浙江 · 横店；线上活动可填「线上 · 微博」" }
              - { name: note, label: 备注, widget: text, required: false }
              - { name: link, label: 了解更多链接, widget: string, required: false, hint: "填写网页链接后，卡片底部才会出现「了解更多」按钮；留空则不显示" }
              - { name: showCover, label: 显示活动封面, widget: boolean, default: false, hint: "打开后请同时在下一项上传封面图" }
              - { name: cover, label: 活动封面图, widget: image, allow_multiple: false, required: false, hint: "仅在「显示活动封面」打开时生效，建议 16:9 横图" }

      - name: interview
        label: 采访合集
        file: data/interviews.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS，例如 2026-11-09 22:00:00" }
          - { name: intro, label: 副标题, widget: string, hint: "显示在页面标题下方的一句话" }
          - name: categories
            label: 采访分类标签
            widget: list
            hint: "这里维护所有采访分类，前端的筛选按钮会自动按此列表生成；新增后即可在下方「采访分类」中选用"
            field: { name: category, label: 分类名称, widget: string }
          - name: interviews
            label: 采访列表
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            hint: "前端会自动按日期倒序排列"
            fields:
              - { name: title, label: 采访标题, widget: string }
              - { name: type, label: 类型, widget: select, options: [{ label: "图文", value: "图文" }, { label: "视频", value: "视频" }], hint: "决定卡片右上角角标：图文（蓝）/ 视频（红 ▶）" }
              - { name: category, label: 采访分类, widget: string, hint: "填写上方「采访分类标签」中的某一项，例如：杂志" }
              - { name: media, label: 媒体 / 平台, widget: string, required: false, hint: "例如：芭莎珠宝、新浪娱乐、封面新闻" }
              - { name: date, label: 采访日期, widget: string, hint: "手动填写，格式 YYYY-MM-DD；只知道月份的填 YYYY-MM 也可以" }
              - { name: drama, label: 关联作品 / 活动, widget: string, required: false, hint: "例如：雀骨、FRED 品牌挚友出镜；没有可留空" }
              - { name: summary, label: 内容摘要, widget: text, required: false, hint: "一两句话概括采访亮点" }
              - { name: link, label: 原文链接, widget: string, required: false, hint: "填写后卡片底部会出现「查看原文 / 观看视频」按钮；留空则不显示" }
              - { name: showCover, label: 显示封面图, widget: boolean, default: false }
              - { name: cover, label: 封面图, widget: image, allow_multiple: false, required: false, hint: "仅在「显示封面图」打开时生效，建议 16:9 横图" }

      - name: brands
        label: 商务代言
        file: data/brands.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - { name: intro, label: 副标题, widget: string, hint: "显示在页面标题下方的一句话" }
          - name: categories
            label: 品类标签
            widget: list
            hint: "这里维护所有品类，前端的筛选按钮会自动按此列表生成"
            field: { name: category, label: 品类名称, widget: string }
          - name: brands
            label: 品牌合作列表
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            hint: "页面只展示「进行中」的合作；已结束的把状态改成「已结束」即可归档隐藏，不用删除"
            fields:
              - { name: name, label: 品牌名称, widget: string }
              - { name: role, label: 合作身份, widget: string, hint: "例如：代言人 / 青春大使 / 品牌挚友 / 合作推广" }
              - { name: category, label: 品类, widget: string, hint: "填写上方「品类标签」中的某一项，例如：彩妆" }
              - { name: since, label: 官宣日期, widget: string, required: false, hint: "格式 YYYY-MM-DD" }
              - { name: status, label: 合作状态, widget: select, options: [{ label: "进行中", value: "进行中" }, { label: "已结束", value: "已结束" }], default: "进行中", hint: "选「已结束」后该品牌不在页面显示，但数据保留" }
              - { name: desc, label: 合作说明, widget: text, required: false }
              - { name: link, label: 官宣链接, widget: string, required: false, hint: "填写后卡片底部会出现「查看官宣」按钮" }
              - { name: logo, label: 品牌图, widget: image, allow_multiple: false, required: false, hint: "可选，建议 16:9 横图；不上传则显示默认图标" }

      - name: works
        label: 作品集
        file: data/works.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - name: works
            label: 作品列表
            widget: list
            summary: "{{fields.type}} · {{fields.name}} · {{fields.role}}"
            hint: "前端按「电影 / 电视剧」切换，并在各自内部分「已播 / 待播」；已播按年份倒序排列"
            fields:
              - { name: name, label: 片名, widget: string }
              - { name: role, label: 角色, widget: string, hint: "官方角色名，例如：谢嘉鱼" }
              - { name: type, label: 类型, widget: select, options: [{ label: "电影", value: "电影" }, { label: "电视剧", value: "电视剧" }], default: "电视剧" }
              - { name: status, label: 状态, widget: select, options: [{ label: "已播", value: "已播" }, { label: "待播", value: "待播" }], default: "已播" }
              - { name: year, label: 年份, widget: number, required: false, hint: "播出 / 上映年份，例如 2026；待播或不确定可留空" }
              - { name: note, label: 备注, widget: string, required: false, hint: "可选，例如：女主、主演、微电影、网络电影、央视儿童剧" }

      - name: riqian
        label: 日签
        file: data/riqian.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - name: items
            label: 日签列表
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            hint: "按最新在前排列；首页推荐只展示前 3 条"
            fields:
              - { name: date, label: 期数 / 日期, widget: string, hint: "例如：第52期 · 11月8日" }
              - { name: title, label: 标题, widget: string, hint: "例如：Vol.052 · 我觉得我也很自由" }
              - { name: caption, label: 正文, widget: text, hint: "日签文案，可换行" }
              - { name: weiboUrl, label: 微博链接, widget: string, required: false }
              - { name: img, label: 配图, widget: image, allow_multiple: false, required: false }
              - { name: h, label: 图片高度, widget: number, required: false, hint: "可选，默认 660" }

      - name: chanchu
        label: 产出总汇
        file: data/chanchu.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - name: entries
            label: 产出汇总列表
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            hint: "首页推荐只展示日期最新的一条"
            fields:
              - { name: date, label: 日期, widget: string, hint: "格式 YYYY-MM-DD" }
              - { name: title, label: 标题, widget: string, hint: "例如：【261108】产出汇总" }
              - { name: text, label: 正文, widget: text }
              - { name: link, label: 原帖链接, widget: string, required: false }
              - { name: count, label: 归档标签, widget: string, required: false, hint: "例如：饭修归档 · 261108" }

      - name: pending
        label: 待播剧
        file: data/pending.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - name: items
            label: 待播列表
            widget: list
            summary: "{{fields.title}} · {{fields.role}}"
            fields:
              - { name: title, label: 剧名, widget: string }
              - { name: role, label: 角色, widget: string }
              - { name: tag, label: 标签, widget: string, hint: "例如：待播 · 古装奇幻" }
              - { name: poster, label: 海报, widget: image, allow_multiple: false, required: false }
              - { name: emoji, label: 占位图标, widget: string, required: false, hint: "没有海报时显示的 emoji" }
              - { name: desc, label: 简介, widget: text }

      - name: bio
        label: 简介
        file: data/bio.json
        fields:
          - { name: updatedAt, label: 更新至, widget: string, hint: "格式：YYYY-MM-DD HH:MM:SS" }
          - name: intro
            label: 个人简介段落
            widget: list
            field: { name: text, label: 段落, widget: text }
            hint: "每段一条，支持 **粗体**"
          - name: representative
            label: 代表作品
            widget: object
            fields:
              - { name: tv, label: 电视剧, widget: text }
              - { name: movie, label: 电影, widget: text }
          - name: honors
            label: 荣誉与成绩
            widget: list
            field: { name: text, label: 条目, widget: text }
            hint: "每行一条，支持 **粗体**"

      - name: stats
        label: 数据面板
        file: data/stats.json
        fields:
          - { name: updatedAt, label: 数据截至, widget: string, hint: "例如：2026-11-09" }
          - name: cards
            label: 核心数据卡
            widget: list
            summary: "{{fields.label}} · {{fields.value}}{{fields.unit}}"
            fields:
              - { name: label, label: 名称, widget: string }
              - { name: value, label: 数值, widget: string }
              - { name: unit, label: 单位, widget: string, required: false, hint: "例如：万" }
              - { name: meta, label: 说明, widget: string, required: false }
              - { name: color, label: 图标颜色, widget: string, required: false, hint: "例如 #E6162D" }
              - { name: icon, label: 图标, widget: select, options: [{ label: "爱心", value: "heart" }, { label: "音符", value: "music" }, { label: "对勾", value: "check" }] }
              - { name: health, label: 健康状态样式, widget: boolean, default: false }
          - name: hot
            label: 超话热帖 TOP5
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: 标题, widget: string }
              - { name: meta, label: 来源 / 时间, widget: string, required: false }
              - { name: link, label: 原帖链接, widget: string, required: false }
          - name: trend
            label: 近 7 日活跃趋势
            widget: list
            summary: "{{fields.label}} · {{fields.value}}"
            fields:
              - { name: label, label: 日期, widget: string }
              - { name: value, label: 数值, widget: string }
              - { name: height, label: 柱高（0-100）, widget: number, default: 80 }
              - { name: highlight, label: 高亮, widget: select, options: [{ label: "普通", value: "" }, { label: "高亮（粉）", value: "highlight" }, { label: "今日（紫）", value: "today" }], default: "" }
