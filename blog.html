<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta property="og:description" content="记录站点公告、功能更新、活动通知与临时维护，仅保留最近 30 天内容。">

<style>
  :root{
    --md-primary: #9172CC;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #E9DDFF;
    --md-on-primary-container: #250460;
    --md-surface: #FEF7FF;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #F7F0FA;
    --md-surface-container: #F2EBF5;
    --md-surface-container-high: #ECE5EF;
    --md-on-surface: #1D1B20;
    --md-on-surface-variant: #49454F;
    --md-outline: #79747E;
    --md-outline-variant: #CAC4D0;
    --md-warning-container: #FFF3E0;
    --md-error: #B3261E;
    --md-error-container: #FDECEA;
    --md-radius-sm: 8px;
    --md-radius-md: 12px;
    --md-radius-lg: 16px;
    --md-elev-1: 0 1px 2px 0 rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.08);
    --md-elev-2: 0 1px 2px 0 rgba(0,0,0,0.16), 0 2px 6px 2px rgba(0,0,0,0.10);
  }
  [data-theme="dark"]{
    --md-surface: #141218;
    --md-surface-container-lowest: #0F0D13;
    --md-surface-container-low: #1D1B20;
    --md-surface-container: #211F26;
    --md-surface-container-high: #2B2930;
    --md-on-surface: #E6E0E9;
    --md-on-surface-variant: #CAC4D0;
    --md-outline: #938F99;
    --md-outline-variant: #49454F;
    --md-primary-container: #4A3A6B;
    --md-on-primary-container: #E9DDFF;
    --md-warning-container: #4A2F0A;
    --md-error-container: #4A1F1C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", Roboto, system-ui, sans-serif;
    background: var(--md-surface);
    color: var(--md-on-surface);
    min-height: 100vh;
    line-height: 1.5;
    font-size: 14px;
    letter-spacing: 0.1px;
  }
  .wrap{max-width: 720px; margin: 0 auto; padding: 0 0 60px;}

  .bg-topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--md-outline-variant);
  }
  [data-theme="dark"] .bg-topbar{ background: rgba(20,18,24,0.82); }
  .bg-back{
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    text-decoration: none; border: none; cursor: pointer;
  }
  .bg-back svg{ width: 20px; height: 20px; stroke: currentColor; }
  .bg-topbar-title{
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bg-theme{
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: none; cursor: pointer;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    display: flex; align-items: center; justify-content: center;
  }
  .bg-theme svg{ width: 20px; height: 20px; stroke: currentColor; }
  .bg-theme .sun{ display: none; }
  [data-theme="dark"] .bg-theme .sun{ display: block; }
  [data-theme="dark"] .bg-theme .moon{ display: none; }

  .bg-hero{
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 20px 16px 12px; flex-wrap: wrap;
  }
  .bg-hero-title{ font-size: 21px; font-weight: 800; letter-spacing: .5px; }
  .bg-hero-sub{ font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
  .bg-hero-time{
    font-size: 11px; font-weight: 600; color: var(--md-primary);
    background: var(--md-primary-container); padding: 5px 11px; border-radius: 999px;
    white-space: nowrap;
  }

  .bg-filter{
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px;
    scrollbar-width: none;
  }
  .bg-filter::-webkit-scrollbar{ display: none; }
  .bg-chip{
    flex-shrink: 0; border: 1px solid var(--md-outline-variant);
    background: var(--md-surface-container-low);
    color: var(--md-on-surface-variant);
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .bg-chip.active{
    background: var(--md-primary); border-color: var(--md-primary);
    color: var(--md-on-primary);
  }

  /* 简版时间线卡片 */
  .bg-timeline{ padding: 4px 16px 20px; position: relative; }
  .bg-item{ position: relative; padding-left: 22px; padding-bottom: 12px; }
  .bg-item::before{
    content: ""; position: absolute; left: 5px; top: 24px; bottom: -4px;
    width: 2px; background: var(--md-outline-variant);
  }
  .bg-item:last-child::before{ display: none; }
  .bg-dot{
    position: absolute; left: 0; top: 16px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--md-surface);
    border: 3px solid var(--md-primary);
    z-index: 1;
  }
  .bg-card{
    display: block; width: 100%; text-align: left;
    background: var(--md-surface-container-lowest);
    border: 1px solid var(--md-outline-variant);
    border-radius: var(--md-radius-md);
    padding: 14px 16px;
    box-shadow: var(--md-elev-1);
    cursor: pointer; color: inherit; font-family: inherit;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .bg-card:hover{
    border-color: var(--md-primary);
    transform: translateY(-1px);
    box-shadow: var(--md-elev-2);
  }
  [data-theme="dark"] .bg-card{ background: var(--md-surface-container); }
  .bg-card-cover{
    display: block; width: 100%; height: 132px; object-fit: cover;
    border-radius: var(--md-radius-sm); margin-bottom: 10px;
    border: 1px solid var(--md-outline-variant);
  }
  .bg-card-top{ display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .bg-tag{
    font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .bg-pin{
    font-size: 11px; font-weight: 700; color: var(--md-error);
    background: var(--md-error-container); padding: 2px 8px; border-radius: 999px;
  }
  .bg-card-date{ margin-left: auto; font-size: 11px; color: var(--md-on-surface-variant); }
  .bg-title{
    font-size: 15px; font-weight: 800; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bg-summary{
    margin-top: 6px; font-size: 12.5px; color: var(--md-on-surface-variant); line-height: 1.65;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bg-more{
    margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--md-primary);
  }

  /* 弹窗 */
  .bg-modal{ display: none; position: fixed; inset: 0; z-index: 9999; }
  .bg-modal.open{ display: flex; align-items: center; justify-content: center; }
  .bg-modal-backdrop{
    position: absolute; inset: 0; background: rgba(0,0,0,.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: bgFade .2s ease;
  }
  .bg-modal-panel{
    position: relative; z-index: 1;
    width: 92%; max-width: 620px; max-height: 86vh;
    background: var(--md-surface);
    border-radius: 20px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
    animation: bgUp .24s cubic-bezier(.22,1,.36,1);
  }
  .bg-modal-close{
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    display: flex; align-items: center; justify-content: center;
  }
  .bg-modal-close svg{ width: 18px; height: 18px; stroke: currentColor; }
  .bg-modal-scroll{
    padding: 22px 20px 26px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .bg-modal-meta{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 42px; }
  .bg-modal-date{ margin-left: auto; font-size: 11px; color: var(--md-on-surface-variant); }
  .bg-modal-title{ font-size: 19px; font-weight: 800; line-height: 1.5; margin-top: 10px; }
  .bg-modal-cover{
    display: block; width: 100%; max-height: 320px; object-fit: cover;
    border-radius: var(--md-radius-sm); margin-top: 14px;
    border: 1px solid var(--md-outline-variant);
  }
  .bg-body{ margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .bg-body p{ font-size: 14px; line-height: 1.85; }
  .bg-body .bg-h{ font-size: 15px; font-weight: 800; margin-top: 2px; }
  .bg-body ul{ padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .bg-body li{ font-size: 14px; line-height: 1.75; }
  .bg-hr{ border: none; border-top: 1px dashed var(--md-outline-variant); }
  .bg-body blockquote{
    margin: 0; padding: 12px 14px 12px 16px;
    border-left: 3px solid var(--md-primary);
    background: var(--md-surface-container);
    border-radius: 0 var(--md-radius-sm) var(--md-radius-sm) 0;
    font-size: 13.5px; line-height: 1.8; color: var(--md-on-surface-variant);
  }
  .bg-body blockquote cite{
    display: block; margin-top: 6px; font-size: 12px; font-style: normal;
    color: var(--md-primary); font-weight: 700;
  }
  .bg-callout{
    display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--md-radius-sm);
    border: 1px solid transparent; font-size: 13px; line-height: 1.75;
  }
  .bg-callout .ico{ flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px; }
  .bg-callout .ico svg{ width: 18px; height: 18px; stroke: currentColor; }
  .bg-callout b{ display: block; margin-bottom: 2px; font-size: 13px; }
  .bg-callout.tip{
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    border-color: rgba(145,114,204,0.35);
  }
  .bg-callout.warn{
    background: var(--md-warning-container); color: #7A3E00;
    border-color: rgba(237,108,2,0.35);
  }
  [data-theme="dark"] .bg-callout.warn{ color: #FFDDB2; }
  .bg-figure{ margin: 0; }
  .bg-figure img{
    width: 100%; border-radius: var(--md-radius-sm);
    border: 1px solid var(--md-outline-variant); display: block;
  }
  .bg-figure figcaption{
    margin-top: 6px; font-size: 12px; color: var(--md-on-surface-variant); text-align: center;
  }
  .bg-file{
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; text-decoration: none;
    background: var(--md-surface-container);
    border: 1px solid var(--md-outline-variant);
    border-radius: var(--md-radius-sm);
    color: var(--md-on-surface);
  }
  .bg-file:hover{ border-color: var(--md-primary); }
  .bg-file .ico{
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: flex; align-items: center; justify-content: center;
  }
  .bg-file .ico svg{ width: 18px; height: 18px; stroke: currentColor; }
  .bg-file .meta{ min-width: 0; flex: 1; }
  .bg-file .name{ font-size: 13.5px; font-weight: 700; word-break: break-all; }
  .bg-file .desc{ font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; }
  .bg-file .arrow{ flex-shrink: 0; color: var(--md-primary); font-size: 12px; font-weight: 700; }
  .bg-actions{ display: flex; flex-wrap: wrap; gap: 10px; }
  .bg-btn{
    display: inline-flex; align-items: center; justify-content: center;
    padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
    text-decoration: none; border: 1px solid transparent;
  }
  .bg-btn.primary{ background: var(--md-primary); color: var(--md-on-primary); }
  .bg-btn.ghost{ background: transparent; color: var(--md-primary); border-color: var(--md-primary); }

  .bg-empty{
    margin: 20px 16px; padding: 34px 20px; text-align: center;
    border: 1px dashed var(--md-outline-variant); border-radius: var(--md-radius-sm);
    color: var(--md-on-surface-variant); font-size: 13.5px; line-height: 1.8;
  }
  .bg-empty .big{ font-size: 30px; display: block; margin-bottom: 10px; }

  footer{
    text-align: center; font-size: 12px; color: var(--md-on-surface-variant);
    padding: 20px 20px 40px; line-height: 1.9;
  }
  footer a{ color: var(--md-primary); text-decoration: none; font-weight: 600; }

  @keyframes bgFade{ from{opacity:0} to{opacity:1} }
  @keyframes bgUp{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }

  /* ===== 左侧侧边栏（与其它页面一致，大屏 ≥768px）===== */
  .app-shell{ display: block; }
  .app-sidebar{ display: none; }
  .menu-item{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:12px; cursor:pointer; transition:background .2s; color:var(--md-on-surface); text-decoration:none; }
  .menu-item:hover{ background:var(--md-surface-container-high); }
  .menu-item.active{ background:var(--md-primary-container); }
  .menu-item.active .ico{ color:var(--md-on-primary-container); }
  .menu-item .ico{ width:24px; height:24px; color:var(--md-primary); flex-shrink:0; }
  .menu-item .ico svg{ width:24px; height:24px; stroke:currentColor; }
  .menu-item-text{ display:flex; flex-direction:column; flex:1; min-width:0; overflow:hidden; }
  .menu-item .txt{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .menu-item .sub{ font-size:12px; color:var(--md-on-surface-variant); margin-top:2px; }
  .menu-list{ padding:12px; display:flex; flex-direction:column; gap:4px; }
  .sidebar-header{ padding:16px 14px 12px; border-bottom:1px solid var(--md-outline-variant); display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--md-primary); }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .sidebar-header svg{ width:24px; height:24px; flex-shrink:0; }
  .sidebar-header .brand-logo{ height:22px; width:auto; display:block; }
  [data-theme="dark"] .sidebar-header .brand-logo{ filter:brightness(1.2); }
  .sidebar-toggle{ width:28px; height:28px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--md-outline-variant); background:var(--md-surface-container); color:var(--md-on-surface-variant); border-radius:8px; cursor:pointer; transition:background .15s,color .15s,transform .25s; }
  .sidebar-toggle svg{ width:16px; height:16px; }
  .sidebar-toggle:hover{ background:var(--md-surface-container-high); color:var(--md-primary); }
  .sidebar-footer{ margin-top:auto; padding:16px 20px; border-top:1px solid var(--md-outline-variant); font-size:12px; color:var(--md-on-surface-variant); }
  .sidebar-footer .footer-links a{ display:inline-flex; align-items:center; gap:6px; color:var(--md-primary); text-decoration:none; }
  .sidebar-footer .footer-links svg{ width:15px; height:15px; stroke:currentColor; }

  @media (min-width: 768px){
    .app-shell{ display:flex; flex-direction:row; }
    .app-sidebar{
      width:240px; flex-shrink:0; display:flex !important; flex-direction:column;
      background:var(--md-surface-container-low);
      border-right:1px solid var(--md-outline-variant);
      position:sticky; top:0; height:100vh; overflow-y:auto; z-index:50;
    }
    .app-sidebar.collapsed{ width:64px; overflow:visible; transition:width .25s cubic-bezier(.22,.61,.36,1); }
    .app-sidebar.collapsed .sidebar-header{ flex-direction:column; gap:10px; padding:16px 8px 12px; justify-content:flex-start; }
    .app-sidebar.collapsed .sidebar-brand{ display:none; }
    .app-sidebar.collapsed .sidebar-toggle{ display:inline-flex; }
    .app-sidebar.collapsed .sidebar-toggle svg{ transform:rotate(180deg); }
    .app-sidebar.collapsed .menu-list{ padding:12px 8px; }
    .app-sidebar.collapsed .menu-item{ padding:12px 0; justify-content:center; border-radius:12px; position:relative; }
    .app-sidebar.collapsed .menu-item-text{ display:none; }
    .app-sidebar.collapsed .menu-item .ico{ margin:0; }
    .app-sidebar.collapsed .sidebar-footer{ padding:12px 8px; }
    .app-sidebar.collapsed .sidebar-footer .footer-links{ flex-direction:column; align-items:center; justify-content:center; gap:8px; flex-wrap:nowrap; }
    .app-sidebar.collapsed .sidebar-footer .footer-links a{ padding:8px; justify-content:center; font-size:0; }
    .app-sidebar.collapsed .sidebar-footer .footer-links a svg{ width:18px; height:18px; margin:0; }
    .app-sidebar.collapsed .sidebar-footer > div:last-child{ display:none; }
    .app-sidebar.collapsed .menu-item:hover::after{
      content:attr(data-tooltip); position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%);
      background:var(--md-surface-container-highest); color:var(--md-on-surface);
      padding:6px 10px; border-radius:8px; font-size:12px; white-space:nowrap;
      box-shadow:0 4px 12px rgba(0,0,0,.18); z-index:200; pointer-events:none;
    }
    .app-content{ flex:1; min-width:0; }
    .app-content .wrap{ max-width:none; margin:0; }
    .bg-back{ display:none; }
  }

  /* Pad / 桌面：双列卡片，隐藏时间线竖线与圆点 */
  @media (min-width: 700px){
    .bg-hero{ padding: 28px 24px 14px; }
    .bg-hero-title{ font-size: 24px; }
    .bg-filter{ padding: 4px 24px 12px; }
    .bg-timeline{
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      padding: 4px 24px 28px;
    }
    .bg-item{ padding-left: 0; padding-bottom: 0; }
    .bg-item::before, .bg-dot{ display: none; }
    .bg-card{ padding: 16px 20px; }
    .bg-card-cover{ height: 150px; }
    .bg-card:hover{ transform: translateY(-2px); }
    .bg-modal-scroll{ padding: 28px 26px 30px; }
    .bg-modal-title{ font-size: 22px; }
    .bg-body p, .bg-body li{ font-size: 14.5px; }
  }
  @media (min-width: 1200px){
    .bg-timeline{ grid-template-columns: repeat(3, 1fr); }
    .bg-card-cover{ height: 172px; }
    .bg-title{ font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- 左侧侧边栏（大屏显示） -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <img class="brand-logo" src="logo_aimi_daily.png" alt="Aimi Daily">
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="折叠/展开侧边栏" aria-label="折叠/展开侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="menu-list">
      <a class="menu-item" href="index.html" data-tooltip="主页">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div class="menu-item-text">
          <div class="txt">主页</div>

<div class="bg-modal" id="bgModal" aria-hidden="true">
  <div class="bg-modal-backdrop" data-close></div>
  <div class="bg-modal-panel" role="dialog" aria-modal="true" aria-label="日志正文">
    <button class="bg-modal-close" id="bgModalClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="bg-modal-scroll">
      <div class="bg-modal-meta" id="bgModalMeta"></div>
      <div class="bg-modal-title" id="bgModalTitle"></div>

<script>
(function(){
  var DEFAULT_RETENTION = 30;
  var data = { updatedAt: '', retentionDays: DEFAULT_RETENTION, tags: [], posts: [] };
  var activeTag = '全部';
  var shownPosts = [];

  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function inline(s){
    var out = esc(s);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    out = out.replace(/\n/g, '<br>');
    return out;
  }
  function normDate(str){
    if(!str) return null;
    var m = String(str).match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
    if(!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDate(str){
    var m = String(str || '').match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
    if(!m) return '';
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var day = Number(m[2]) + '月' + Number(m[3]) + '日';
    var wd = isNaN(d.getTime()) ? '' : WEEK[d.getDay()];
    var time = (m[4] !== undefined) ? (' ' + m[4] + ':' + m[5]) : '';
    return day + time + (wd ? ' ' + wd : '');
  }
  function tagColor(name){
    for(var i = 0; i < data.tags.length; i++){
      if(data.tags[i] && data.tags[i].name === name) return data.tags[i].color || '#9172CC';
    }
    return '#9172CC';
  }
  function tagHtml(name){
    if(!name) return '';
    var c = tagColor(name);
    return '<span class="bg-tag" style="color:' + esc(c) + ';border-color:' + esc(c) + '33;background:' + esc(c) + '1a;">' + esc(name) + '</span>';
  }
  function fileIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  }
  function calloutIcon(type){
    if(type === 'warn'){
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  }

  function renderBlock(b){
    if(!b || !b.type) return '';
    switch(b.type){
      case 'heading':
        return b.text ? '<div class="bg-h">' + inline(b.text) + '</div>' : '';
      case 'text':
        return b.text ? '<p>' + inline(b.text) + '</p>' : '';
      case 'list':
        if(!b.items || !b.items.length) return '';
        return '<ul>' + b.items.filter(function(x){ return x; }).map(function(x){
          return '<li>' + inline(x) + '</li>';
        }).join('') + '</ul>';
      case 'tip':
      case 'warn':
        if(!b.text && !b.title) return '';
        return '<div class="bg-callout ' + (b.type === 'warn' ? 'warn' : 'tip') + '">'
          + '<span class="ico">' + calloutIcon(b.type) + '</span>'
          + '<div>' + (b.title ? '<b>' + esc(b.title) + '</b>' : '') + inline(b.text || '') + '</div>'
          + '</div>';
      case 'quote':
        if(!b.text) return '';
        return '<blockquote>' + inline(b.text) + (b.cite ? '<cite>— ' + esc(b.cite) + '</cite>' : '') + '</blockquote>';
      case 'image':
        if(!b.image) return '';
        return '<figure class="bg-figure"><img src="' + esc(b.image) + '" alt="' + esc(b.caption || '') + '" loading="lazy">'
          + (b.caption ? '<figcaption>' + esc(b.caption) + '</figcaption>' : '') + '</figure>';
      case 'file':
        if(!b.file) return '';
        var fname = b.label || b.file.split('/').pop();
        return '<a class="bg-file" href="' + esc(b.file) + '" target="_blank" rel="noopener" download>'
          + '<span class="ico">' + fileIcon() + '</span>'
          + '<span class="meta"><span class="name">' + esc(fname) + '</span>'
          + (b.desc ? '<span class="desc">' + esc(b.desc) + '</span>' : '')
          + '</span><span class="arrow">下载</span></a>';
      case 'button':
        if(!b.url) return '';
        return '<div class="bg-actions"><a class="bg-btn ' + (b.style === 'ghost' ? 'ghost' : 'primary') + '" href="' + esc(b.url) + '">'
          + esc(b.label || '查看') + '</a></div>';
      case 'divider':
        return '<hr class="bg-hr">';
      default:
        return b.text ? '<p>' + inline(b.text) + '</p>' : '';
    }
  }

  function visiblePosts(){
    var days = Number(data.retentionDays) || DEFAULT_RETENTION;
    var cutoff = new Date();
    cutoff.setHours(0,0,0,0);
    cutoff.setDate(cutoff.getDate() - days);
    var list = (data.posts || []).filter(function(p){
      if(!p || p.archived) return false;
      var d = normDate(p.date);
      return d && d >= cutoff;
    });
    list.sort(function(a, b){
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      var da = normDate(a.date), db = normDate(b.date);
      return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
    });
    return list;
  }

  function renderFilter(){
    var box = document.getElementById('bgFilter');
    if(!box) return;
    var names = ['全部'];
    (data.tags || []).forEach(function(t){ if(t && t.name && names.indexOf(t.name) === -1) names.push(t.name); });
    (data.posts || []).forEach(function(p){ if(p && p.tag && names.indexOf(p.tag) === -1) names.push(p.tag); });
    box.innerHTML = names.map(function(n){
      return '<button class="bg-chip' + (n === activeTag ? ' active' : '') + '" data-tag="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.bg-chip'), function(btn){
      btn.addEventListener('click', function(){
        activeTag = btn.getAttribute('data-tag') || '全部';
        renderFilter();
        renderList();
      });
    });
  }

  function renderList(){
    var listEl = document.getElementById('bgTimeline');
    var emptyEl = document.getElementById('bgEmpty');
    shownPosts = visiblePosts().filter(function(p){
      return activeTag === '全部' || p.tag === activeTag;
    });
    if(!shownPosts.length){
      listEl.innerHTML = '';
      if(emptyEl) emptyEl.hidden = false;
      return;
    }
    if(emptyEl) emptyEl.hidden = true;
    listEl.innerHTML = shownPosts.map(function(p, i){
      var cover = (p.showCover && p.cover)
        ? '<img class="bg-card-cover" src="' + esc(p.cover) + '" alt="' + esc(p.title || '') + '" loading="lazy">'
        : '';
      return '<article class="bg-item">'
        + '<span class="bg-dot"></span>'
        + '<button class="bg-card" data-idx="' + i + '">'
        + cover
        + '<span class="bg-card-top">' + tagHtml(p.tag)
        + (p.pinned ? '<span class="bg-pin">置顶</span>' : '')
        + '<span class="bg-card-date">' + esc(fmtDate(p.date)) + '</span></span>'
        + '<span class="bg-title">' + esc(p.title || '') + '</span>'
        + (p.summary ? '<span class="bg-summary">' + inline(p.summary) + '</span>' : '')
        + '<span class="bg-more">阅读全文 ›</span>'
        + '</button>'
        + '</article>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.bg-card'), function(btn){
      btn.addEventListener('click', function(){
        var idx = Number(btn.getAttribute('data-idx'));
        openPost(shownPosts[idx]);
      });
    });
  }

  function openPost(p){
    if(!p) return;
    var meta = document.getElementById('bgModalMeta');
    var title = document.getElementById('bgModalTitle');
    var body = document.getElementById('bgModalBody');
    var cover = document.getElementById('bgModalCover');
    meta.innerHTML = tagHtml(p.tag) + (p.pinned ? '<span class="bg-pin">置顶</span>' : '')
      + '<span class="bg-modal-date">' + esc(fmtDate(p.date)) + '</span>';
    title.textContent = p.title || '';
    if(p.showCover && p.cover){
      cover.src = p.cover;
      cover.alt = p.title || '';
      cover.hidden = false;
    } else {
      cover.removeAttribute('src');
      cover.hidden = true;
    }
    body.innerHTML = (p.summary ? '<p>' + inline(p.summary) + '</p>' : '')
      + (p.blocks || []).map(renderBlock).join('');
    var modal = document.getElementById('bgModal');
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.getElementById('bgModalClose').focus();
  }

  function closeModal(){
    var modal = document.getElementById('bgModal');
    if(!modal) return;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function apply(json){
    if(!json) return;
    data.updatedAt = json.updatedAt || data.updatedAt;
    data.retentionDays = json.retentionDays || data.retentionDays;
    data.tags = Array.isArray(json.tags) ? json.tags : [];
    data.posts = Array.isArray(json.posts) ? json.posts : [];
    var upd = document.getElementById('bgUpdated');
    if(upd) upd.textContent = '更新至 ' + (data.updatedAt || '—');
    renderFilter();
    renderList();
  }

  // 主题
  var html = document.documentElement;
  if(localStorage.getItem('ami-theme') === 'dark') html.setAttribute('data-theme', 'dark');
  var themeBtn = document.getElementById('bgTheme');
  if(themeBtn){
    themeBtn.addEventListener('click', function(){
      var dark = html.getAttribute('data-theme') === 'dark';
      if(dark){ html.removeAttribute('data-theme'); localStorage.setItem('ami-theme', 'light'); }
      else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('ami-theme', 'dark'); }
    });
  }

  // 弹窗关闭
  var modal = document.getElementById('bgModal');
  if(modal){
    modal.addEventListener('click', function(e){
      if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-close')) closeModal();
    });
    document.getElementById('bgModalClose').addEventListener('click', closeModal);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeModal();
    });
  }

  renderFilter();
  renderList();
  fetch('data/blog.json?v=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(apply)
    .catch(function(){ /* 保留空状态 */ });
})();
</script>

<script>
// 侧边栏折叠/展开（仅电脑/平板端生效）
(function(){

  if(!sidebar || !toggle) return;
  if(localStorage.getItem('ami-sidebar-collapsed') === '1') sidebar.classList.add('collapsed');
  toggle.addEventListener('click', function(){
    var willCollapse = !sidebar.classList.contains('collapsed');
    sidebar.classList.toggle('collapsed', willCollapse);
    localStorage.setItem('ami-sidebar-collapsed', willCollapse ? '1' : '0');
  });
})();
</script>
